name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libx11-dev libxi-dev patchelf dbus-daemon
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Rust checks
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust unit tests including Unix sockets
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --include-ignored
